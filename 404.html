<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Mosam Biswas</title>
  <meta name="description" content="This page does not exist. The rest of Mosam Biswas's portfolio does." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0b0a" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="author" type="text/plain" href="/humans.txt" />

  <!-- GitHub Pages serves this file for a missing path at any depth, so every
       URL on this page is absolute. -->
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="stylesheet" href="/style.css" />

  <style>
    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    .lost-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1.15rem var(--pad);
    }

    .lost-head a {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
    }

    .lost-head sup {
      font-family: var(--font-mono);
      font-size: 0.55rem;
      margin-left: 2px;
    }

    .lost {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(1.6rem, 3.5vw, 2.6rem);
      padding: clamp(1rem, 4vw, 3rem) var(--pad) clamp(2rem, 5vw, 4rem);
    }

    .lost__name {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(4.4rem, 17vw, 13.5rem);
      line-height: 0.9;
      letter-spacing: -0.025em;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .lost__name span:last-child {
      align-self: flex-end;
      color: transparent;
      -webkit-text-stroke: 2px var(--ink);
    }

    @supports not (-webkit-text-stroke: 2px black) {
      .lost__name span:last-child {
        color: var(--ink-dim);
      }
    }

    .lost__line {
      font-size: clamp(1.05rem, 1.8vw, 1.4rem);
      line-height: 1.5;
      color: var(--ink-dim);
      max-width: 36ch;
    }

    .lost__line em {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.15em;
      color: var(--ink);
    }

    /* ---- the terminal ---- */

    .term {
      font-family: var(--font-mono);
      font-size: 0.86rem;
      line-height: 1.7;
      width: min(100%, 46rem);
      border: 1px solid var(--line);
      /* A flat fill, not backdrop-filter: blurring what sits over a live
         WebGL canvas re-rasterises the box every frame. */
      background: rgba(11, 11, 10, 0.86);
      padding: 0.9rem 1.1rem 1rem;
      cursor: text;
    }

    .term__bar {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-faint);
      padding-bottom: 0.7rem;
      margin-bottom: 0.7rem;
      border-bottom: 1px solid var(--line);
    }

    .term__out {
      max-height: 16.5rem;
      overflow-y: auto;
      overflow-wrap: anywhere;
    }

    .term__out p {
      white-space: pre-wrap;
    }

    .term__out pre {
      font: inherit;
      white-space: pre-wrap;
      color: var(--ink-dim);
    }

    .term__out a {
      color: var(--accent);
      text-decoration: none;
    }

    .term__out a:hover,
    .term__out a:focus-visible {
      text-decoration: underline;
    }

    .p {
      color: var(--accent);
    }

    .dim {
      color: var(--ink-dim);
    }

    .term__in {
      display: flex;
      gap: 0.6ch;
      align-items: baseline;
    }

    .term__in input {
      flex: 1;
      min-width: 0;
      font: inherit;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      padding: 0;
      caret-color: var(--accent);
    }

    .lost__links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 1.6rem;
    }

    .lost__links a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      padding-bottom: 2px;
      transition: border-color 0.3s var(--ease), color 0.3s var(--ease);
    }

    .lost__links a:hover,
    .lost__links a:focus-visible {
      color: var(--accent);
      border-color: var(--accent);
    }

    @media (max-width: 600px) {
      /* 16px or iOS zooms the page when the input takes focus */
      .term {
        font-size: 1rem;
        padding: 0.8rem 0.9rem 0.9rem;
      }

      .term__bar span:last-child {
        display: none;
      }

      .lost__name span:last-child {
        -webkit-text-stroke-width: 1.5px;
      }
    }
  </style>
</head>

<body class="is-loaded">
  <canvas class="field" id="field" aria-hidden="true"></canvas>
  <div class="noise" aria-hidden="true"></div>

  <header class="lost-head">
    <a href="/">Mosam&nbsp;Biswas<sup>©</sup></a>
    <span class="mono">Error · 404</span>
  </header>

  <main class="lost">
    <h1 class="lost__name" aria-label="404, page not found">
      <span>404</span>
      <span>Lost</span>
    </h1>

    <p class="lost__line">This page never made it out of the <em>forge</em>. The rest of the site did.</p>

    <section class="term" id="term" aria-label="A small terminal">
      <div class="term__bar"><span>visitor@mosambiswas</span><span>type help</span></div>
      <div class="term__out" id="out" aria-live="polite">
        <p><span class="p">~ $</span> cd <span id="missing">this page</span></p>
        <p class="dim" id="reply">cd: no such file or directory</p>
      </div>
      <form class="term__in" id="form" autocomplete="off">
        <label class="p" for="cmd">~ $</label>
        <input id="cmd" name="cmd" type="text" spellcheck="false" autocapitalize="off" aria-label="Type a command, try help" />
      </form>
    </section>

    <nav class="lost__links mono" aria-label="Where to instead">
      <a href="/">Home</a>
      <a href="/#projects">Work</a>
      <a href="/resume.html">Résumé</a>
      <a href="/sheichobi/sheichobi.html">Photographs</a>
      <a href="/#contact">Contact</a>
    </nav>
  </main>

  <script>
    (() => {
      const out = document.getElementById('out');
      const form = document.getElementById('form');
      const input = document.getElementById('cmd');

      let path = location.pathname;
      try { path = decodeURIComponent(path); } catch (e) { /* keep it raw */ }
      const asked = path;
      if (path.length > 60) path = path.slice(0, 57) + '...';
      document.getElementById('missing').textContent = path;

      /* Every place worth going, and the names people might type for it. */
      const places = [
        { to: '/', names: ['~', '/', 'home', 'index', 'index.html', '..'] },
        { to: '/resume.html', names: ['resume', 'resume.html', 'résumé'] },
        { to: '/cv/', names: ['cv', 'resume.txt', 'terminal'] },
        { to: '/#projects', names: ['work', 'projects'] },
        { to: '/#about', names: ['about'] },
        { to: '/#research', names: ['research', 'paper'] },
        { to: '/#contact', names: ['contact', 'hire', 'email'] },
        { to: '/certificates.html', names: ['certificates', 'certificates.html', 'certs'] },
        { to: '/sheichobi/sheichobi.html', names: ['sheichobi', 'photos', 'photography', 'photographs'] },
        { to: '/humans.txt', names: ['humans.txt', 'humans'] },
        { to: '/PixelShift/', names: ['pixelshift'] },
        { to: '/To-Do/', names: ['to-do', 'todo'] },
        { to: '/Fill.ai/', names: ['fill.ai', 'fillai'] }
      ];
      const find = (name) => {
        const n = name.toLowerCase().replace(/^\.?\/+|\/+$/g, '') || '/';
        return places.find((p) => p.names.includes(n) || p.names.includes('/' + n));
      };

      const distance = (a, b) => {
        const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
        for (let j = 1; j <= b.length; j++) d[0][j] = j;
        for (let i = 1; i <= a.length; i++) {
          for (let j = 1; j <= b.length; j++) {
            d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1,
              d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
          }
        }
        return d[a.length][b.length];
      };

      /* The name closest to what was typed, if it is close enough to be a typo. */
      const guess = (typed) => {
        const t = typed.toLowerCase().replace(/\.html?$/, '').replace(/[^a-z0-9.-]/g, '');
        if (t.length < 3) return null;
        let best = null;
        places.forEach((p) => p.names.forEach((n) => {
          const d = distance(t, n.replace(/\.html$/, ''));
          if (d <= Math.max(1, Math.floor(n.length / 4)) && (!best || d < best.d)) best = { p, n, d };
        }));
        return best && best.p;
      };

      const scroll = () => { out.scrollTop = out.scrollHeight; };

      /* Output is always built with textContent, never innerHTML: the path
         and the commands come from whoever is typing. */
      const fill = (el, parts) => {
        [].concat(parts).forEach((part) => {
          if (typeof part === 'string') {
            el.append(part);
          } else if (part.href) {
            const a = document.createElement('a');
            a.href = part.href;
            a.textContent = part.text;
            el.append(a);
          } else {
            const s = document.createElement('span');
            s.className = part.cls;
            s.textContent = part.text;
            el.append(s);
          }
        });
      };

      const line = (parts, cls) => {
        const p = document.createElement('p');
        if (cls) p.className = cls;
        fill(p, parts);
        out.append(p);
        scroll();
      };

      const go = (place) => {
        line(['→ ', { href: place.to, text: place.to }], 'dim');
        setTimeout(() => { location.href = place.to; }, 450);
      };

      /* Paths that bots probe all day. The bots only read the status code,
         so these answers are for the rare person who tries one by hand. */
      const probes = [
        [/^\/(wp-|wordpress|xmlrpc\.php)/i, 'this is not WordPress. It is hand-written HTML, and there is nothing to log in to.'],
        [/^\/\.env/i, 'no .env here. No backend, no database, no secrets. Just static files and a shader.'],
        [/^\/\.git(\/|$)/i, ['no .git to scrape. The whole source is public anyway: ',
          { href: 'https://github.com/BiswasMosam/BiswasMosam.github.io', text: 'github.com/BiswasMosam/BiswasMosam.github.io' }]],
        [/^\/(admin|administrator|login|signin|dashboard|cpanel|phpmyadmin|pma)(\/|\.|$)/i, 'there is no admin panel. The admin is me, and I use VS Code.'],
        [/\.(php|aspx?|jsp|cgi)$|^\/cgi-bin/i, 'server code, on GitHub Pages? Bold. This site has never run a line of it.'],
        [/^\/(api|graphql)(\/|$)/i, ['no API. The closest thing is ', { href: '/humans.txt', text: '/humans.txt' }, '.']],
        [/\.aws|\.ssh|id_rsa|credentials|\.sql$|\.bak$/i, 'no keys, no backups, no database dumps. Good try though.']
      ];
      const probe = probes.find(([pattern]) => pattern.test(asked));

      if (probe) {
        const reply = document.getElementById('reply');
        reply.textContent = '';
        reply.className = '';
        fill(reply, ['cd: '].concat(probe[1]));
      } else {
        /* The missing path's last segment might be a typo of a real page. */
        const last = path.split('/').filter(Boolean).pop() || '';
        const hint = guess(last);
        if (hint && hint.to !== '/') {
          line(['did you mean ', { href: hint.to, text: hint.to }, '?'], 'dim');
        }
      }

      const history = [];
      let cursor = 0;

      const commands = {
        help: () => {
          line('ls                 what is here', 'dim');
          line('cd <place>         go there (cd resume, cd work, cd ~)', 'dim');
          line('cat humans.txt     who made this', 'dim');
          line('curl cv            the résumé, terminal edition', 'dim');
          line('whoami, pwd, date, echo, history, clear', 'dim');
        },
        ls: () => {
          const items = [
            ['resume', '/resume.html'], ['cv', '/cv/'], ['work', '/#projects'], ['about', '/#about'],
            ['research', '/#research'], ['certificates', '/certificates.html'],
            ['sheichobi', '/sheichobi/sheichobi.html'], ['contact', '/#contact'], ['humans.txt', '/humans.txt']
          ];
          const parts = [];
          items.forEach(([name, href], i) => {
            parts.push({ href, text: name });
            if (i < items.length - 1) parts.push('   ');
          });
          line(parts);
        },
        cd: (arg) => {
          if (!arg) return go(places[0]);
          const place = find(arg);
          if (place) return go(place);
          const near = guess(arg);
          line('cd: no such file or directory: ' + arg, 'dim');
          if (near) line(['did you mean ', { href: near.to, text: near.to }, '?'], 'dim');
        },
        cat: (arg) => {
          if (/^\/?humans(\.txt)?$/i.test(arg)) {
            fetch('/humans.txt').then((r) => r.text()).then((text) => {
              const pre = document.createElement('pre');
              pre.textContent = text.trim();
              out.append(pre);
              scroll();
            }).catch(() => line('cat: the network is having a moment', 'dim'));
            return;
          }
          line('cat: ' + (arg || '') + ': no such file (try cat humans.txt)', 'dim');
        },
        curl: (arg) => {
          if (/(^|\/)cv\/?$|mosambiswas/i.test(arg)) {
            line(['in a real terminal it prints in colour: ', { cls: 'p', text: 'curl -L mosambiswas.com/cv' }], 'dim');
            return go(find('cv'));
          }
          line(['curl: this one is pretend. In a real terminal, try ', { cls: 'p', text: 'curl -L mosambiswas.com/cv' }], 'dim');
        },
        whoami: () => line('visitor. probably a developer. definitely curious.', 'dim'),
        pwd: () => line(path + '   (which does not exist, which is how you got here)', 'dim'),
        date: () => line(new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', dateStyle: 'full', timeStyle: 'short' }) + ' in Navi Mumbai', 'dim'),
        echo: (arg) => line(arg || ''),
        history: () => history.forEach((h, i) => line(String(i + 1).padStart(3) + '  ' + h, 'dim')),
        clear: () => { out.textContent = ''; },
        sudo: () => line('visitor is not in the sudoers file. This incident will be reported.', 'dim'),
        rm: () => line('rm: not today.', 'dim'),
        vim: () => line('you are now stuck in vim. kidding. type exit.', 'dim'),
        exit: () => go(places[0])
      };
      commands.open = commands.cd;
      commands.logout = commands.exit;
      commands.home = commands.exit;
      commands.dir = commands.ls;
      commands.cls = commands.clear;
      commands.nvim = commands.vim;
      commands.nano = commands.vim;
      commands.emacs = commands.vim;

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const raw = input.value.trim();
        input.value = '';
        line([{ cls: 'p', text: '~ $ ' }, raw]);
        if (!raw) return;
        history.push(raw);
        cursor = history.length;
        const [name, ...rest] = raw.split(/\s+/);
        const key = name.toLowerCase();
        const run = Object.hasOwn(commands, key) && commands[key];
        if (run) {
          run(rest.join(' '));
        } else if (find(raw)) {
          go(find(raw));
        } else {
          line('command not found: ' + name + '. try help', 'dim');
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' && cursor > 0) {
          cursor -= 1;
          input.value = history[cursor];
          e.preventDefault();
        } else if (e.key === 'ArrowDown') {
          cursor = Math.min(cursor + 1, history.length);
          input.value = history[cursor] || '';
          e.preventDefault();
        } else if (e.key === 'Tab' && input.value) {
          /* Complete a command, or a place after cd / open. */
          const [name, arg] = input.value.split(/\s+/, 2);
          const pool = arg === undefined ? Object.keys(commands) : places.flatMap((p) => p.names);
          const stem = (arg === undefined ? name : arg).toLowerCase();
          const hit = pool.find((n) => n.startsWith(stem) && n !== stem);
          if (hit) {
            input.value = arg === undefined ? hit + ' ' : name + ' ' + hit;
            e.preventDefault();
          }
        }
      });

      /* Clicking anywhere in the terminal puts the caret back, unless a link
         or a text selection was the point of the click. */
      document.getElementById('term').addEventListener('click', (e) => {
        if (e.target.closest('a') || String(window.getSelection())) return;
        input.focus();
      });

      /* Focus straight away only where there is a real keyboard; on a phone it
         would throw the keyboard over the page. */
      if (matchMedia('(pointer: fine)').matches) input.focus({ preventScroll: true });

      console.log('%cLost, and looking in the console? Respect. Type help in the terminal on the page.',
        'font-family:"Space Mono",ui-monospace,monospace; color:#ff5227;');
    })();
  </script>
  <script src="/shader.js"></script>
</body>

</html>
